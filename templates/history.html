<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Certificate History</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

{% include "navbar.html" %}

<div class="dashboard">

    <h1>Automated Certificate Generator</h1>

    <h2>Certificate History</h2>

    {% if files %}

    <table>

        <tr>
            <th>Student Name</th>
            <th>Preview</th>
            <th>Download</th>
            <th>Delete</th>
        </tr>

        {% for file in files %}

        <tr>

            <td>{{ file.replace(".png","") }}</td>

            <td>
                <a href="{{ url_for('certificate', filename=file) }}">
                    <button class="btn-green">
                        👁 Preview
                    </button>
                </a>
            </td>

            <td>
                <a href="{{ url_for('download_certificate', filename=file) }}">
                    <button>
                        ⬇ Download
                    </button>
                </a>
            </td>

            <td>
                <a href="{{ url_for('delete_certificate', filename=file) }}"
                   onclick="return confirm('Are you sure you want to delete this certificate?');">
                    <button class="btn-red">
                        🗑 Delete
                    </button>
                </a>
            </td>

        </tr>

        {% endfor %}

    </table>

    {% else %}

        <h3 style="color:red;">No certificates found.</h3>

    {% endif %}

    <br><br>

    <a href="{{ url_for('dashboard') }}">
        <button class="btn-gray">
            ⬅ Back to Dashboard
        </button>
    </a>

</div>

{% include "footer.html" %}

</body>

</html>
